# nginx do HOST — serve o site estático publicado pelo `api` e NADA MAIS (docs/02
# §2, §7). O `RenderJob` publica trocando um SYMLINK `dist` (T-13), então o nginx
# PRECISA seguir symlinks: `disable_symlinks off`. Sem isso, o nginx recusa o
# `dist` (ELOOP/403) e o site sai do ar a cada publicação.
#
# Instalação: copie para /etc/nginx/sites-available/, ajuste `server_name` e
# `<PUBLISH_BASE_DIR>` (= o PUBLISH_BASE_DIR do api, ex.: /var/lib/election-pool),
# e `ln -s` para sites-enabled. O `root` aponta para `<PUBLISH_BASE_DIR>` e as
# requisições resolvem via o symlink `dist`.

server {
  listen 80;
  listen [::]:80;
  server_name _;  # ajuste para o domínio real

  # docs/02 §7: nginx serve <PUBLISH_BASE_DIR>/dist. `dist` é um SYMLINK trocado
  # atomicamente pela publicação (T-13) — seguir symlink é obrigatório.
  root /var/lib/election-pool/dist;
  index index.html;

  # CRÍTICO (T-13): a publicação é uma troca de symlink. `off` = seguir symlinks
  # sem restrição. Qualquer outro valor (`on`/`if_not_owner`) quebra a publicação.
  disable_symlinks off;

  # CRÍTICO para a navegação. O astro gera `metodologia/index.html`, então `/metodologia`
  # é um DIRETÓRIO e o nginx emite um 301 para acrescentar a barra final. Por padrão esse
  # 301 é ABSOLUTO e montado a partir de `server_name` + da porta em que o nginx escuta —
  # que não é a porta pela qual o visitante chegou. Num container publicado como
  # `8080:80`, clicar em "metodologia" redirecionava para `http://localhost/metodologia/`
  # (porta 80, sem nada no ar): a home abria e a navegação morria no primeiro clique.
  # Mesma armadilha atrás de qualquer proxy/TLS terminando fora daqui.
  # `off` emite `Location: /metodologia/` — relativo, resolvido pelo navegador contra a
  # origem real (host, porta e esquema corretos).
  absolute_redirect off;

  # Charset explícito para o HTML/JSON servido.
  charset utf-8;

  # ── IP real do visitante atrás do Traefik (analytics) ──────────────────────
  # O nginx recebe as requisições do container do Traefik (rede `coolify`), então
  # sem isto `$remote_addr` seria o IP do PROXY e o access_log lido pelo GoAccess
  # ficaria inútil (uma linha por visita, todas com o mesmo IP interno). Confiamos
  # nas faixas privadas da rede docker e extraímos o IP do cliente do
  # `X-Forwarded-For` que o Traefik injeta. `recursive on` pega o primeiro IP
  # público da cadeia, não o último salto.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Dois destinos de access_log:
  #  1) stdout (symlink da imagem, formato `main`): INALTERADO — é o que o Coolify
  #     captura na aba Logs.
  #  2) arquivo em volume compartilhado (`goaccess_logs`), formato `combined`: é o
  #     que o serviço `goaccess` parseia (--log-format=COMBINED) para o dashboard.
  access_log /var/log/nginx/access.log main;
  access_log /var/log/goaccess/access.log combined;

  # ── Fallback de MARCA (T-14) ────────────────────────────────────────────────
  # O nginx nunca entrega o 404/50x CRU. Antes da primeira publicação `dist/` não
  # existe e TODA requisição vira 404; um gate/adapter também pode abortar o render
  # e manter o site sem `dist`. Nesses casos servimos uma página NOSSA ("edição
  # sendo preparada") em vez do erro seco do nginx. O arquivo vive FORA de `dist`
  # (montado em /usr/share/nginx/fallback pelo docker-compose), então existe mesmo
  # sem site publicado. É conteúdo nosso — não viola o R3.
  #
  # O status é preservado (404 continua 404, 503 continua 503): a página é honesta
  # sobre "ainda não há isto aqui", só que legível. O /data.json (API pública) tem
  # o seu próprio location adiante e um 404 nele segue sendo um 404 de recurso.
  error_page 404 /offline.html;
  error_page 500 502 503 504 /offline.html;
  location = /offline.html {
    internal;
    root /usr/share/nginx/fallback;
    add_header Cache-Control "no-store" always; # estado transitório: nunca cacheia
  }

  # /data.json é a API pública de dado (docs/03 §5): cache de 5 min + CORS aberto.
  # Precede o location genérico para os cabeçalhos valerem só para ele.
  location = /data.json {
    add_header Cache-Control "public, max-age=300" always;   # docs/03 §5
    add_header Access-Control-Allow-Origin "*" always;       # CORS aberto (docs/03 §5)
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    types { } default_type application/json;
    try_files $uri =404;
  }

  # Telemetria de operação (docs/02 §5): instantâneo do último boot (contagens +
  # job_runs) escrito pelo api no volume publish_data, FORA de dist. Só telemetria
  # nossa — nunca dado de terceiro (R3). Nunca cacheia (estado vivo).
  location = /_diag.json {
    alias /var/lib/election-pool/_diag.json;
    types { } default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin "*" always;
  }

  # Assets com hash no nome (Astro) podem ter cache longo e imutável.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Páginas HTML: cache curto (o conteúdo muda a cada ciclo de 2h).
  location / {
    add_header Cache-Control "public, max-age=300" always;
    try_files $uri $uri/ $uri.html =404;
  }

  # Nunca servir o blob de proveniência nem qualquer coisa fora do dist (R3/docs/08).
  location ~ /\.(?!well-known) {
    deny all;
  }
}

# ── Dashboard de tráfego (GoAccess, tempo real) ───────────────────────────────
# Servido SÓ no host `eleicao-status.fgti.cloud`, NUNCA no site público. Não é
# painel de produto (docs/00: "não existe usuário logado") — é telemetria de
# operação, mesmo espírito do /_diag.json, mas com dado sensível (IPs/rotas dos
# visitantes), então o acesso é FECHADO por Basic Auth no Traefik (middleware
# `electionpool-statsauth`), não aqui. O HTML é gerado pelo serviço `goaccess` no
# volume `goaccess_report`; a atualização ao vivo chega por WebSocket proxied para
# o servidor WS interno do goaccess (porta 7890 na rede coolify).
server {
  listen 80;
  listen [::]:80;
  server_name eleicao-status.fgti.cloud;
  charset utf-8;

  # Relatório escrito pelo goaccess (volume `goaccess_report`, montado read-only).
  root /usr/share/nginx/goaccess-report;
  index index.html;

  # Basic Auth (ops). O .htpasswd é gerado no boot a partir de STATS_USER/STATS_PASS
  # (ver Dockerfile / 40-htpasswd.sh / docs/02 §8) — NÃO é login de produto. Feito no
  # nginx, não no Traefik: o middleware basicauth via `${VAR}` em label não instancia
  # neste Coolify (dava 503). Vale para TODAS as locations, inclusive o /ws — o stream
  # ao vivo também é protegido, e o navegador reencaminha a credencial no handshake.
  auth_basic "eleicao-status (acesso restrito)";
  auth_basic_user_file /etc/nginx/.htpasswd;

  # Este host não conta na própria analytics: seus acessos não vão para o log que
  # o goaccess lê (senão o dashboard contaria a si mesmo).
  access_log off;

  # DNS embutido do docker: resolve o nome de serviço `goaccess` em RUNTIME. Sem
  # isto, o nginx resolveria `goaccess` no boot e, se o container ainda não subiu,
  # abortaria o config (crash loop). Com resolver + variável no proxy_pass, a
  # resolução é preguiçosa e tolera a ordem de subida (evita depends_on circular:
  # goaccess já depende do nginx para o arquivo de log existir).
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $goaccess_ws http://goaccess:7890;

  location /ws {
    # SEM Basic Auth aqui: o navegador NÃO reenvia a credencial do Basic Auth no
    # handshake do WebSocket (confirmado pelo mantenedor do GoAccess) — com auth o
    # WS dá 401 e o dashboard trava em "AUTHORIZING WEBSOCKET SESSION". A página HTML
    # (o dashboard de fato) segue protegida pelo auth_basic do server. O stream do WS
    # é limitado pela checagem de Origin do goaccess (--origin) e pela obscuridade do
    # host. Para travar o WS de verdade, o caminho é o JWT nativo (--ws-auth) — ver
    # docs/02 §8 (follow-up).
    auth_basic off;
    proxy_pass $goaccess_ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1d;   # a conexão WS é longa; não derrubar por inatividade
  }

  location / {
    # `=404` (não um fallback pra /index.html): o relatório é servido pela diretiva
    # `index` e não há roteamento client-side. O fallback `/index.html` causava loop
    # de redirecionamento interno (500) — e o relatório nem existe até o goaccess
    # escrever a 1ª vez, o que garantiria o loop. Antes disso, 404 honesto.
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-store" always;   # estado vivo, nunca cacheia
  }
}
