# Stack local COMPLETA do election-pool: `docker compose up` na raiz do repo sobe
# tudo — Postgres compartilhado, migrations, seed, jobs de ingestão, modelo, render
# e o nginx servindo o site publicado. Nada além de preencher o `.env` (copie de
# `.env.example`; não há segredo nele).
#
# ── Postgres COMPARTILHADO (isolado deste repo) ──────────────────────────────
# O serviço `postgres` aqui é um servidor de desenvolvimento ÚNICO da máquina,
# pensado para ser usado por MAIS DE UM projeto (hoje: election-pool e
# finance-insights). Por isso ele tem nomes neutros e estáveis:
#
#   container: dev-postgres      rede: dev-shared      volume: dev_pgdata
#
# `POSTGRES_DATABASES` no `.env` lista os bancos criados/garantidos a cada `up`
# (serviço `postgres-init`, idempotente) — adicionar um projeto novo é acrescentar
# um nome nessa lista. Aplicações que rodam NO HOST (caso do finance-insights)
# alcançam o servidor por `localhost:${POSTGRES_PORT}`; containers de outros
# projetos podem entrar na rede externa `dev-shared` e usar o host `dev-postgres`.
#
# ── Publicação (por que volume nomeado, e não bind mount) ────────────────────
# O RenderJob publica trocando um SYMLINK `dist` (T-13). Bind mount de diretório
# do Windows não suporta symlink do jeito que o swap exige, então `dist/`,
# `dist-staging/` e os snapshots vivem num VOLUME NOMEADO (`publish_data`),
# compartilhado entre `api` (escreve) e `nginx` (lê). Mesmo filesystem ⇒ o
# `rename(2)` do swap continua atômico.

name: election-pool

services:
  # ── Postgres de desenvolvimento, compartilhado entre projetos ──────────────
  postgres:
    image: postgres:17-alpine
    container_name: dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Banco administrativo. Os bancos dos projetos são criados por `postgres-init`.
      POSTGRES_DB: postgres
    ports:
      # Exposto no host para as aplicações que rodam fora do Docker.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - dev_pgdata:/var/lib/postgresql/data
    networks:
      dev-shared:
        aliases:
          # Hostname estável para containers de OUTROS projetos que entrarem na
          # rede `dev-shared` (o nome de serviço `postgres` só vale neste compose).
          - dev-postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ── Garante os bancos de cada projeto (idempotente, roda a cada `up`) ──────
  # Um script de `docker-entrypoint-initdb.d` só rodaria na PRIMEIRA criação do
  # volume; este one-shot roda sempre, então acrescentar um banco ao `.env` basta.
  postgres-init:
    image: postgres:17-alpine
    container_name: dev-postgres-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DATABASES: ${POSTGRES_DATABASES:-election_pool}
    networks: [dev-shared]
    restart: 'no'
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        for db in $$(echo "$$POSTGRES_DATABASES" | tr ',' ' '); do
          [ -z "$$db" ] && continue
          if [ -z "$$(psql -tAc "SELECT 1 FROM pg_database WHERE datname='$$db'")" ]; then
            createdb "$$db"
            echo "[postgres-init] banco criado: $$db"
          else
            echo "[postgres-init] banco já existe: $$db"
          fi
        done

  # ── API: migrations no boot, seed, jobs de ingestão, modelo e render ───────
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile
    image: election-pool-api:local
    container_name: election-pool-api
    restart: unless-stopped
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${ELECTION_POOL_DB:-election_pool}
      # Raiz da publicação DENTRO do container (volume nomeado, ver cabeçalho).
      PUBLISH_BASE_DIR: /var/lib/election-pool
      HEALTH_PORT: '8081'
      HEALTH_HOST: '0.0.0.0'
      GIT_SHA: ${GIT_SHA:-local}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      # Boot (ver apps/api/src/main.ts). Em produção os três ficam em `false`:
      # o seed é um passo de deploy e os jobs seguem o cron de docs/02 §3.
      SEED_REFERENCE_ON_BOOT: ${SEED_REFERENCE_ON_BOOT:-true}
      RUN_JOBS_ON_BOOT: ${RUN_JOBS_ON_BOOT:-true}
      RENDER_ON_BOOT: ${RENDER_ON_BOOT:-false}
      PUBLISH_PLACEHOLDER_WHEN_EMPTY: ${PUBLISH_PLACEHOLDER_WHEN_EMPTY:-false}
    volumes:
      - publish_data:/var/lib/election-pool
      # Fotos oficiais dos candidatos, em VOLUME — não no filesystem do container.
      #
      # Sem isto o CandidatePhotosJob baixava para um diretório local ao container
      # e o banco passava a afirmar que a foto existe. Qualquer OUTRO container (um
      # `compose run` de render, um rebuild, uma recriação) via o banco dizendo
      # `/candidatos/x.jpg` e não tinha o arquivo — o site publicava 13 fotos e
      # servia 404 em 10 delas. Banco e disco discordando é exatamente o que o R4
      # existe para impedir.
      #
      # Na primeira montagem o Docker copia o que já está na imagem para o volume
      # vazio, então os SVG de amostra versionados sobrevivem.
      - candidate_photos:/app/apps/web/public/candidatos
    ports:
      # /health interno — preso ao loopback do host, nunca exposto publicamente.
      - '127.0.0.1:${HEALTH_PORT:-8081}:8081'
    networks: [dev-shared]

  # ── nginx: serve o site estático publicado (e NADA mais, docs/02 §2) ───────
  nginx:
    image: nginx:1.27-alpine
    container_name: election-pool-nginx
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - publish_data:/var/lib/election-pool:ro
      - ./infra/nginx/election-pool.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '${SITE_PORT:-8080}:80'
    networks: [dev-shared]

volumes:
  # Dados do Postgres compartilhado. Nome fixo: sobrevive a `docker compose down`
  # e é o mesmo para qualquer projeto que aponte para este servidor.
  dev_pgdata:
    name: dev_pgdata
  # Árvore de publicação (dist/, dist-staging/, snapshots). Volume nomeado para o
  # symlink `dist` do swap atômico funcionar (bind mount do Windows não serve).
  publish_data:
    name: election_pool_publish
  # Fotos de candidatura. Volume próprio (e não dentro de publish_data) porque a
  # árvore de publicação é trocada por symlink a cada render; as fotos são INSUMO
  # do build, não saída dele.
  candidate_photos:
    name: election_pool_candidate_photos

networks:
  # Rede compartilhada entre projetos da máquina. Nome fixo para outro compose
  # poder declará-la como `external: true` e alcançar o host `dev-postgres`.
  dev-shared:
    name: dev-shared
