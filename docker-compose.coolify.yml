# Compose de DEPLOY no Coolify (VPS 31.97.243.112). Diferente de:
#   - docker-compose.yml            → stack local completa (sobe o próprio Postgres
#                                      compartilhado `dev-postgres`).
#   - infra/docker-compose.prod.yml → produção genérica (Postgres no compose + nginx
#                                      no HOST).
#
# Aqui o Postgres NÃO está no compose: reaproveitamos o servidor Postgres que já roda
# no Coolify (o mesmo que o smart-shelf usa). O host dele na rede `coolify` é o nome do
# container do banco (ver env `PG_HOST`). Para alcançá-lo, este app precisa estar na
# rede `coolify` — no Coolify isso é o toggle "Connect To Predefined Network" (setado
# via API no deploy). Nenhum segredo mora neste arquivo: `${...}` vem das variáveis de
# ambiente da aplicação no Coolify.
#
# Dois serviços de runtime + um one-shot:
#   db-init → garante o database `election_pool` DENTRO do Postgres compartilhado
#             (idempotente; mesma filosofia do `postgres-init` do compose local).
#   api     → migra no boot, semeia, roda o pipeline e o RenderJob; publica o site
#             estático no volume `publish_data` (symlink `dist`, T-13).
#   nginx   → serve `publish_data/dist`. O domínio/TLS é resolvido pelo Traefik do
#             Coolify via a variável mágica `SERVICE_FQDN_NGINX_80`.

services:
  # ── Garante o database dedicado no Postgres compartilhado do Coolify ─────────
  db-init:
    image: postgres:17-alpine
    restart: 'no'
    environment:
      PGHOST: ${PG_HOST}
      PGPORT: ${PG_PORT:-5432}
      PGUSER: ${PG_USER:-postgres}
      PGPASSWORD: ${PG_PASSWORD}
      ELECTION_POOL_DB: ${ELECTION_POOL_DB:-election_pool}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        until pg_isready -q; do echo "[db-init] aguardando Postgres em $$PGHOST..."; sleep 2; done
        if [ -z "$$(psql -tAc "SELECT 1 FROM pg_database WHERE datname='$$ELECTION_POOL_DB'")" ]; then
          createdb "$$ELECTION_POOL_DB"
          echo "[db-init] database criado: $$ELECTION_POOL_DB"
        else
          echo "[db-init] database já existe: $$ELECTION_POOL_DB"
        fi

  # ── API: migrations no boot, seed, jobs de ingestão, modelo e render ────────
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${PG_USER:-postgres}:${PG_PASSWORD}@${PG_HOST}:${PG_PORT:-5432}/${ELECTION_POOL_DB:-election_pool}
      # Raiz da publicação DENTRO do container (volume nomeado compartilhado com o nginx).
      PUBLISH_BASE_DIR: /var/lib/election-pool
      HEALTH_PORT: '8081'
      HEALTH_HOST: '0.0.0.0'
      # SOURCE_COMMIT é injetado pelo Coolify no deploy (proveniência do data.json).
      GIT_SHA: ${SOURCE_COMMIT:-coolify}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      # Comportamento de boot. Hoje o gate M-7 (backtest 2022, Q-07) reprova e não há
      # dado de pesquisa (Q-09), então o site publica o "estado vazio explicado". Para
      # que ISSO já apareça no ar, o render roda no boot e o placeholder é permitido.
      # Ajuste para `false` quando houver dado real passando pelos gates.
      SEED_REFERENCE_ON_BOOT: ${SEED_REFERENCE_ON_BOOT:-true}
      RUN_JOBS_ON_BOOT: ${RUN_JOBS_ON_BOOT:-true}
      RENDER_ON_BOOT: ${RENDER_ON_BOOT:-true}
      PUBLISH_PLACEHOLDER_WHEN_EMPTY: ${PUBLISH_PLACEHOLDER_WHEN_EMPTY:-true}
    volumes:
      - publish_data:/var/lib/election-pool
      - candidate_photos:/app/apps/web/public/candidatos
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:8081/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  # ── nginx: serve o site estático publicado (e NADA mais, docs/02 §2) ────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Variável mágica do Coolify: gera domínio + labels do Traefik + TLS para a
      # porta 80 deste serviço. O valor (FQDN) vem das envs da aplicação no Coolify.
      - SERVICE_FQDN_NGINX_80
    expose:
      - '80'
    volumes:
      - publish_data:/var/lib/election-pool:ro
      - ./infra/nginx/election-pool.conf:/etc/nginx/conf.d/default.conf:ro
      # Fallback de marca (offline.html) — montado FORA de `dist` para existir mesmo
      # antes da primeira publicação. Ver `error_page` no .conf.
      - ./infra/nginx/fallback:/usr/share/nginx/fallback:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:80/']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  # Árvore de publicação (dist/, dist-staging/, snapshots). Volume nomeado para o
  # symlink `dist` do swap atômico funcionar (T-13). Compartilhado api↔nginx.
  publish_data:
  # Fotos de candidatura — INSUMO do build, não saída; volume próprio (a árvore de
  # publicação é trocada por symlink a cada render).
  candidate_photos:
