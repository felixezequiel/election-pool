# Compose de DEPLOY no Coolify (VPS 31.97.243.112). Diferente de:
#   - docker-compose.yml            → stack local completa (sobe o próprio Postgres
#                                      compartilhado `dev-postgres`).
#   - infra/docker-compose.prod.yml → produção genérica (Postgres no compose + nginx
#                                      no HOST).
#
# Aqui o Postgres NÃO está no compose: reaproveitamos o servidor Postgres que já roda
# no Coolify (o mesmo que o smart-shelf usa). O host dele na rede `coolify` é o nome do
# container do banco (ver env `PG_HOST`). Para alcançá-lo, este app precisa estar na
# rede `coolify` — no Coolify isso é o toggle "Connect To Predefined Network" (setado
# via API no deploy). Nenhum segredo mora neste arquivo: `${...}` vem das variáveis de
# ambiente da aplicação no Coolify.
#
# Dois serviços de runtime + um one-shot:
#   db-init → garante o database `election_pool` DENTRO do Postgres compartilhado
#             (idempotente; mesma filosofia do `postgres-init` do compose local).
#   api     → migra no boot, semeia, roda o pipeline e o RenderJob; publica o site
#             estático no volume `publish_data` (symlink `dist`, T-13).
#   nginx   → serve `publish_data/dist`. O domínio/TLS é resolvido pelo Traefik do
#             Coolify via a variável mágica `SERVICE_FQDN_NGINX_80`.

services:
  # ── Garante o database dedicado no Postgres compartilhado do Coolify ─────────
  db-init:
    image: postgres:17-alpine
    restart: 'no'
    networks: [coolify]
    environment:
      PGHOST: ${PG_HOST}
      PGPORT: ${PG_PORT:-5432}
      PGUSER: ${PG_USER:-postgres}
      PGPASSWORD: ${PG_PASSWORD}
      ELECTION_POOL_DB: ${ELECTION_POOL_DB:-election_pool}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        until pg_isready -q; do echo "[db-init] aguardando Postgres em $$PGHOST..."; sleep 2; done
        if [ -z "$$(psql -tAc "SELECT 1 FROM pg_database WHERE datname='$$ELECTION_POOL_DB'")" ]; then
          createdb "$$ELECTION_POOL_DB"
          echo "[db-init] database criado: $$ELECTION_POOL_DB"
        else
          echo "[db-init] database já existe: $$ELECTION_POOL_DB"
        fi

  # ── API: migrations no boot, seed, jobs de ingestão, modelo e render ────────
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    networks: [coolify]
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${PG_USER:-postgres}:${PG_PASSWORD}@${PG_HOST}:${PG_PORT:-5432}/${ELECTION_POOL_DB:-election_pool}
      # Raiz da publicação DENTRO do container (volume nomeado compartilhado com o nginx).
      PUBLISH_BASE_DIR: /var/lib/election-pool
      HEALTH_PORT: '8081'
      HEALTH_HOST: '0.0.0.0'
      # SOURCE_COMMIT é injetado pelo Coolify no deploy (proveniência do data.json).
      GIT_SHA: ${SOURCE_COMMIT:-coolify}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      # Comportamento de boot. Hoje o gate M-7 (backtest 2022, Q-07) reprova e não há
      # dado de pesquisa (Q-09), então o site publica o "estado vazio explicado". Para
      # que ISSO já apareça no ar, o render roda no boot e o placeholder é permitido.
      # Ajuste para `false` quando houver dado real passando pelos gates.
      SEED_REFERENCE_ON_BOOT: ${SEED_REFERENCE_ON_BOOT:-true}
      RUN_JOBS_ON_BOOT: ${RUN_JOBS_ON_BOOT:-true}
      RENDER_ON_BOOT: ${RENDER_ON_BOOT:-true}
      PUBLISH_PLACEHOLDER_WHEN_EMPTY: ${PUBLISH_PLACEHOLDER_WHEN_EMPTY:-true}
    volumes:
      - publish_data:/var/lib/election-pool
      - candidate_photos:/app/apps/web/public/candidatos
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:8081/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  # ── nginx: serve o site estático publicado (e NADA mais, docs/02 §2) ────────
  # Imagem própria (infra/nginx/Dockerfile) com a config e o fallback ASSADOS — o
  # Coolify não copia a árvore do repo no runtime, então bind mount de arquivo do
  # repo falha. O `dist` publicado continua vindo pelo volume `publish_data`.
  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    restart: unless-stopped
    networks: [coolify]
    depends_on:
      - api
    expose:
      - '80'
    volumes:
      - publish_data:/var/lib/election-pool:ro
    # Labels do Traefik ESCRITAS À MÃO. A variável mágica SERVICE_FQDN do Coolify não
    # anexou router ao serviço neste app compose (o nginx ficava sem nenhum label
    # traefik.* e o Traefik devolvia 404), então declaramos os routers explicitamente
    # — mesmo padrão do proxy do Coolify. Dois domínios com routers SEPARADOS: o sslip
    # resolve sozinho e sobe já; eleicoes.fgti.cloud só emite TLS após o registro A no
    # DNS, mas por ser router separado não bloqueia o do sslip.
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.middlewares.gzip.compress=true
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      # ── sslip.io (imediato, sem depender de DNS) ──
      - 'traefik.http.routers.electionpool-sslip-http.entryPoints=http'
      - 'traefik.http.routers.electionpool-sslip-http.rule=Host(`election-pool.31.97.243.112.sslip.io`)'
      - traefik.http.routers.electionpool-sslip-http.middlewares=redirect-to-https
      - traefik.http.routers.electionpool-sslip-http.service=electionpool
      - 'traefik.http.routers.electionpool-sslip-https.entryPoints=https'
      - 'traefik.http.routers.electionpool-sslip-https.rule=Host(`election-pool.31.97.243.112.sslip.io`)'
      - traefik.http.routers.electionpool-sslip-https.tls=true
      - traefik.http.routers.electionpool-sslip-https.tls.certresolver=letsencrypt
      - traefik.http.routers.electionpool-sslip-https.middlewares=gzip
      - traefik.http.routers.electionpool-sslip-https.service=electionpool
      # ── eleicoes.fgti.cloud (exige registro A eleicoes.fgti.cloud -> 31.97.243.112) ──
      - 'traefik.http.routers.electionpool-eleicoes-http.entryPoints=http'
      - 'traefik.http.routers.electionpool-eleicoes-http.rule=Host(`eleicoes.fgti.cloud`)'
      - traefik.http.routers.electionpool-eleicoes-http.middlewares=redirect-to-https
      - traefik.http.routers.electionpool-eleicoes-http.service=electionpool
      - 'traefik.http.routers.electionpool-eleicoes-https.entryPoints=https'
      - 'traefik.http.routers.electionpool-eleicoes-https.rule=Host(`eleicoes.fgti.cloud`)'
      - traefik.http.routers.electionpool-eleicoes-https.tls=true
      - traefik.http.routers.electionpool-eleicoes-https.tls.certresolver=letsencrypt
      - traefik.http.routers.electionpool-eleicoes-https.middlewares=gzip
      - traefik.http.routers.electionpool-eleicoes-https.service=electionpool
      - traefik.http.services.electionpool.loadbalancer.server.port=80
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:80/']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  # Rede gerenciada pelo Coolify onde o Traefik e o Postgres compartilhado vivem.
  # `external: true` faz os serviços entrarem NELA (em vez de uma rede isolada do
  # app), o que dá: ingress do Traefik para o nginx e acesso ao Postgres pelo nome
  # do container (`PG_HOST`). É o mesmo mecanismo que o smart-shelf usa.
  coolify:
    external: true

volumes:
  # Árvore de publicação (dist/, dist-staging/, snapshots). Volume nomeado para o
  # symlink `dist` do swap atômico funcionar (T-13). Compartilhado api↔nginx.
  publish_data:
  # Fotos de candidatura — INSUMO do build, não saída; volume próprio (a árvore de
  # publicação é trocada por symlink a cada render).
  candidate_photos:
