# CI (T-14, docs/02 §7): `pnpm verify` em todo push/PR; build da imagem em tag.
#
# O `verify` roda lint + typecheck + testes + build. Os testes de integração da API
# (T-02..T-13) falam com um Postgres REAL, então subimos um serviço Postgres e
# rodamos as migrations antes deles. O backtest (M-7) roda nos testes unitários do
# modelo, mas seu VEREDITO de reprovação NÃO falha o CI — só o gate de publicação o
# consome (docs/07 §4/§6, LOG T-09): `backtest.spec.ts` afirma o veredito honesto
# (REPROVA) como um FATO esperado, então o teste em si passa.

name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: election_pool
          POSTGRES_PASSWORD: election_pool
          POSTGRES_DB: election_pool
        # A porta 55432 no host casa com o infra/.env (DATABASE_URL) usado pelos
        # testes. O serviço mapeia o 5432 do container para 55432 no runner.
        ports:
          - '55432:5432'
        options: >-
          --health-cmd "pg_isready -U election_pool -d election_pool"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://election_pool:election_pool@localhost:55432/election_pool

    steps:
      - uses: actions/checkout@v4

      # docs/02 §2: pina Node 22 LTS (mesma major da imagem de produção).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.0'

      - name: Cache do store do pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Instala dependências
        run: pnpm install --frozen-lockfile

      # docs/02 §7: migrations ANTES dos jobs/testes de integração. Falha aqui
      # bloqueia o CI (mesma cadeia que o boot da API roda).
      - name: Migrations (Postgres do CI)
        run: pnpm db:migrate

      # Semeia a referência (institutos/candidatos/aliases/corridas) que alguns
      # testes de integração esperam presente.
      - name: Seed de referência
        run: pnpm db:seed

      # lint + typecheck + testes + build do site. `verify` é o gate de docs/07 §5.
      - name: pnpm verify
        run: pnpm verify

  # Build da imagem do `api` em TAG (docs/02 §7: build de imagem em tag).
  image:
    runs-on: ubuntu-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem do api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/api:latest
